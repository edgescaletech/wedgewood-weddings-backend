openapi: 3.0.3
info:
  title: Wedgewood Weddings Event Sync & Labor Planning API
  description: |
    Unified REST API for Wedgewood Weddings:
    1. **Events & Catering Sync**: Synchronizes weekly wedding event schedules, catering menus, bar packages, and rental details directly from Salesforce Opportunity, CPQ Quote, and CPQ QuoteLine records.
    2. **Role-Based Access Control (RBAC)**:
       - **Admin (Director/HQ)**: Full access to all events across all 109 venues nationwide.
       - **General Manager (GM) / Coordinator**: Automatically scoped to view only their assigned/mapped venue properties.
    3. **Labor Goals & Staffing**: Allows Admins to upload labor goal CSV files and manage staff targets, budgeted hours, and role requirements via full CRUD operations.
  version: 1.2.0
  contact:
    name: Wedgewood Weddings Tech Team
    email: salesforceadmin@wedgewoodweddings.com

servers:
  - url: /

tags:
  - name: System
    description: Liveness and service discovery endpoints
  - name: Role-Based Access Control (RBAC)
    description: User identity, roles, and venue mapping permissions
  - name: Events & Catering Sync
    description: Salesforce Opportunity and CPQ Quote enrichment (scoped by role)
  - name: Labor Goals & Staffing
    description: Admin CSV upload and CRUD operations for event labor targets

paths:
  /healthz:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Returns service liveness status.
      operationId: getHealthStatus
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/auth/me:
    get:
      tags:
        - Role-Based Access Control (RBAC)
      summary: Get current user profile and venue mappings
      description: |
        Returns the authenticated user's role and their assigned venue properties.
        - **Admin**: Has global access (`assignedVenues: "ALL"`).
        - **GM**: Restricted to mapped properties (e.g. `Ken Caryl Vista`, `Boulder Creek`).
        - **Coordinator / Staff**: Restricted to their single assigned venue.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile and venue mapping permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events:
    get:
      tags:
        - Events & Catering Sync
      summary: Get weekly wedding events (scoped by role & venue)
      description: |
        Retrieves wedding events for the ISO week containing the specified date.
        
        **RBAC Venue Scoping:**
        - **Admin**: Can view all events nationwide across all 109 venues, or filter by any `venueId`.
        - **GM / Coordinator**: The backend automatically filters results to return **only events belonging to their mapped venue(s)**. If a GM requests an unassigned venue ID, the server responds with `403 Forbidden`.
        
        Results are enriched with primary CPQ Quotes and QuoteLines, and cached in memory for 5 minutes.
      operationId: getWeeklyEvents
      security:
        - BearerAuth: []
      parameters:
        - name: week
          in: query
          required: false
          description: |
            An anchor date within the target week in `YYYY-MM-DD` format.
            If omitted, defaults to the current date/week.
          schema:
            type: string
            format: date
            example: "2026-11-02"
        - name: venueId
          in: query
          required: false
          description: |
            Optional Salesforce Account ID of a specific venue (e.g. `0011P000012oMy9QAE`).
            - **Admin**: Can specify any venue ID or leave empty to see all.
            - **GM**: Must be one of their mapped venue IDs.
          schema:
            type: string
            example: "0011P000012oMy9QAE"
        - name: refresh
          in: query
          required: false
          description: Set to `true` to bypass the 5-minute cache and query Salesforce directly.
          schema:
            type: boolean
            default: false
            example: false

      responses:
        '200':
          description: Successfully retrieved weekly wedding events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyEventsResponse'
        '400':
          description: Invalid request parameters (e.g. invalid date format).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User is not authorized to access events for this venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error or failure querying Salesforce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events/{id}:
    get:
      tags:
        - Events & Catering Sync
      summary: Get a wedding event by ID
      description: Returns a single enriched wedding event from PostgreSQL, with a fallback to Salesforce.
      operationId: getEventById
      parameters:
        - name: id
          in: path
          required: true
          description: Salesforce Opportunity ID for the event.
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved the wedding event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEvent'
        '400':
          description: Event ID is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The event could not be retrieved from Salesforce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/labor-goals:
    get:
      tags:
        - Labor Goals & Staffing
      summary: Get labor goals
      description: Retrieve labor goals filtered by planning week and optionally by venue.
      operationId: getLaborGoals
      security:
        - BearerAuth: []
      parameters:
        - name: week
          in: query
          required: true
          description: Monday date of the target planning week (YYYY-MM-DD).
          schema:
            type: string
            format: date
            example: "2026-11-02"
        - name: venueId
          in: query
          required: false
          description: Optional Salesforce Account ID of the venue to filter goals.
          schema:
            type: string
            example: "0011P000012oMxxQAE"
      responses:
        '200':
          description: Labor goals retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborGoalsListResponse'
        '400':
          description: Missing or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Labor Goals & Staffing
      summary: Create a single labor goal
      description: Manually adds an individual role target or labor goal record.
      operationId: createLaborGoal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborGoalInput'
      responses:
        '201':
          description: Labor goal created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborGoal'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/labor-goals/upload:
    post:
      tags:
        - Labor Goals & Staffing
      summary: Bulk upload labor goals via CSV (Admin only)
      description: |
        Allows Admins to upload a CSV file containing labor targets, hours, and roles.
        The backend validates headers and bulk inserts/updates matching records.
      operationId: uploadLaborGoalsCSV
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file containing labor goal entries.
      responses:
        '200':
          description: CSV file parsed and imported successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSVUploadResult'
        '400':
          description: Invalid CSV structure, missing columns, or bad data format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/labor-goals/{id}:
    put:
      tags:
        - Labor Goals & Staffing
      summary: Update a labor goal
      description: Update target hours, headcount, or budget limit for a specific goal record.
      operationId: updateLaborGoal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the labor goal record.
          schema:
            type: string
            example: "lg-101"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborGoalInput'
      responses:
        '200':
          description: Labor goal updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaborGoal'
        '404':
          description: Goal record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Labor Goals & Staffing
      summary: Delete a labor goal
      description: Removes a labor goal record from the system.
      operationId: deleteLaborGoal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the labor goal record to delete.
          schema:
            type: string
            example: "lg-101"
      responses:
        '200':
          description: Record deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleted"
                  id:
                    type: string
                    example: "lg-101"
        '404':
          description: Goal record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Standard JSON Web Token (JWT) carrying user claims:
        `role` (`admin`, `gm`, `coordinator`, `staff`) and `assigned_venues` array.

  schemas:
    UserProfileResponse:
      type: object
      required:
        - userId
        - name
        - email
        - role
        - assignedVenues
      properties:
        userId:
          type: string
          description: Salesforce User ID (starts with 005).
          example: "0051P0000052FxxQAE"
        name:
          type: string
          example: "Jensen Hand"
        email:
          type: string
          example: "jensen.hand@wedgewoodweddings.com"
        role:
          type: string
          enum: [admin, gm, coordinator, staff]
          description: |
            User role level:
            - `admin`: Nationwide access across all 109 venues.
            - `gm`: General Manager scoped to their assigned properties.
            - `coordinator`: Day-of coordinator scoped to their venue.
            - `staff`: Kitchen/Banquet staff.
          example: "gm"
        assignedVenues:
          type: array
          description: List of venues this user is authorized to manage.
          items:
            $ref: '#/components/schemas/AssignedVenue'

    AssignedVenue:
      type: object
      required:
        - venueId
        - venueName
      properties:
        venueId:
          type: string
          description: Salesforce Account ID of the venue (starts with 001).
          example: "0011P000012oMy9QAE"
        venueName:
          type: string
          example: "Ken Caryl Vista"

    WeeklyEventsResponse:
      type: object
      required:
        - weekStart
        - weekEnd
        - fromCache
        - events
      properties:
        weekStart:
          type: string
          format: date
          description: Monday start date of the requested week (YYYY-MM-DD).
          example: "2026-11-02"
        weekEnd:
          type: string
          format: date
          description: Sunday end date of the requested week (YYYY-MM-DD).
          example: "2026-11-08"
        fromCache:
          type: boolean
          description: True if response was served from Go in-memory cache; false if queried from Salesforce.
          example: false
        events:
          type: array
          description: List of wedding events scheduled for the week (scoped to user's permitted venues).
          items:
            $ref: '#/components/schemas/WeddingEvent'

    WeddingEvent:
      type: object
      required:
        - id
        - name
        - eventDate
        - stageName
      properties:
        id:
          type: string
          description: Salesforce Opportunity 18-character ID (starts with 006).
          example: "006Pq00000aeF0RIAU"
        name:
          type: string
          description: Wedding event name / couple title.
          example: "Enoch Mendez & Arieanna Lager Ceremony & Reception"
        eventDate:
          type: string
          format: date
          description: Wedding date (YYYY-MM-DD).
          example: "2026-11-02"
        dayOfWeek:
          type: string
          description: Day of the week.
          example: "Monday"
        startTime:
          type: string
          description: Formatted ceremony/event start time.
          example: "11:00 PM"
        endTime:
          type: string
          description: Formatted reception end time.
          example: "4:00 AM"
        eventType:
          type: string
          description: Wedding event classification detail.
          example: "Ceremony & Reception"
        guestCount:
          type: integer
          description: Expected guest count (covers).
          example: 41
        venue:
          type: string
          description: Venue name display formula.
          example: "Brittany Hill"
        venueId:
          type: string
          description: Salesforce Account ID of the venue (starts with 001).
          example: "0011P000012oMxxQAE"
        venueProperty:
          type: string
          description: Traversed Account Name of the venue.
          example: "Brittany Hill"
        venueGM:
          type: string
          description: Venue General Manager name (traversed from User lookup).
          example: "Danielle Martinez"
        ceremonyLocation:
          type: string
          description: Specific ceremony area within venue property.
          example: "Lakeside Arbor"
        photoBooth:
          type: boolean
          nullable: true
          description: Indicates whether a photo booth is booked; null means Salesforce did not provide a value.
          example: true
        photoboothStaffed:
          type: boolean
          description: Indicates if photo booth is staffed by venue staff vs external vendor.
          example: false
        hasBar:
          type: boolean
          description: True if bar or cocktail hour is configured.
          example: true
        barLocation:
          type: string
          description: Area where bar/cocktail hour takes place.
          example: "Terrace Cocktail Patio"
        signatureDrinks:
          type: string
          description: Specialty cocktail details from Primary Planning Details.
          example: "Mojito & Spicy Paloma"
        chargerPlates:
          type: string
          description: Table charger plate style from Primary Planning Details.
          example: "Gold Beaded Charger"
        notes:
          type: string
          description: Coordinator notes and special date notes.
          example: "Allergy alert: Groom has peanut allergy"
        stageName:
          type: string
          description: Salesforce Opportunity Stage.
          example: "Closed Won"
        package:
          type: string
          description: Package tier formula.
          example: "Classic Package"
        coordinator:
          type: string
          description: Assigned Wedgewood Day-of Coordinator name.
          example: "Jessica Reynolds"
        djName:
          type: string
          description: Assigned DJ Name.
          example: "DJ Beats & Harmony"
        decorSetupTime:
          type: string
          description: Earliest allowed vendor/decor setup time.
          example: "9:00 AM"
        beoNotes:
          type: string
          description: Staff-Facing BEO Rich Text notes.
          example: "<p>Final walkthrough completed with couple on 10/19.</p>"
        contractSigned:
          type: boolean
          description: Indicates whether client contract has been executed.
          example: true
        quote:
          $ref: '#/components/schemas/QuoteDetails'

    QuoteDetails:
      type: object
      description: Enriched CPQ Quote & Quote Line catering, bar, and rental breakdown.
      properties:
        quoteId:
          type: string
          description: Salesforce CPQ Quote ID (starts with a2M).
          example: "a2MPq0000000sXYZIAU"
        quoteNumber:
          type: string
          description: Quote reference number.
          example: "Q-40105775"
        isPrimary:
          type: boolean
          description: Indicates if this quote is flagged as Primary on the Opportunity.
          example: true
        mealService:
          type: string
          description: Meal service format.
          example: "Buffet Service"
        mealPackage:
          type: string
          description: Banquet food meal package name.
          example: "Three Entree Buffet"
        mealPackageQty:
          type: number
          description: Meal package guest cover count.
          example: 41
        barPackage:
          type: string
          description: Bar package specification.
          example: "Premium Hosted Bar"
        hostedBarType:
          type: string
          description: Specific hosted bar line item name.
          example: "Hosted Premium Bar Service"
        hostedBarHours:
          type: number
          description: Number of hosted bar service hours.
          example: 4
        noHostBar:
          type: string
          description: Populated if a No-Host / Cash Bar line exists.
          example: ""
        champagne:
          type: string
          description: Champagne toast item.
          example: "Champagne Toast for All Guests"
        champagneQty:
          type: number
          description: Champagne cover quantity.
          example: 41
        wine:
          type: string
          description: Wine product line.
          example: "Hosted Wine with Dinner"
        wineQty:
          type: number
          description: Wine guest cover quantity.
          example: 41
        wineGlassesNeeded:
          type: boolean
          description: Inferred table setting requirement for wine glasses.
          example: true
        champagneFlutesNeeded:
          type: boolean
          description: Inferred table setting requirement for champagne flutes.
          example: true
        lateNightSnacks:
          type: array
          description: Late night snacks / munchies selected.
          items:
            type: string
          example: ["Mini Grilled Cheese & Tomato Soup", "Warm Pretzel Bites"]
        loveLetters:
          type: string
          description: Marquee Love Letters decor package.
          example: "Illuminated LOVE Letters 4ft"
        loveLettersQty:
          type: number
          description: Love Letters quantity.
          example: 1
        barItems:
          type: array
          description: Comprehensive beverage and bar service selections.
          items:
            type: string
          example: ["Champagne Toast for All Guests", "Wine: Cabernet Sauvignon"]
        appetizers:
          type: array
          description: Cocktail hour hors d'oeuvres and appetizers.
          items:
            type: string
          example: ["Mini Crab Cakes with Remoulade", "Chicken & Waffles Bites", "Cheese with Wafers"]
        entrees:
          type: array
          description: Selected dinner entrees.
          items:
            type: string
          example: ["Panko Parmesan Chicken", "Carved Pit Ham with Dijon Glaze"]
        sidesSalads:
          type: array
          description: Accompaniment side dishes and salads.
          items:
            type: string
          example: ["Garlic Mashed Potatoes", "Seasonal Roasted Vegetables", "Garden Salad"]
        dessert:
          type: string
          description: Wedding dessert or cake item.
          example: "Personalized Wedding Cake"
        linens:
          type: array
          description: Selected table linen items and colors.
          items:
            type: string
          example: ["Linen, Elite Full Length", "Linen Color: Ivory"]
        napkins:
          type: string
          description: Napkin selection and color.
          example: "Napkin Color: Burgundy"
        chairs:
          type: string
          description: Seating selection.
          example: "Chairs, Elite Chiavari"
        decorRentals:
          type: array
          description: Event decor and rental items.
          items:
            type: string
          example: ["Floral Centerpieces", "Gold Charger Plates", "Lawn Games Bundle"]

    LaborGoalsListResponse:
      type: object
      required:
        - weekStart
        - weekEnd
        - goals
      properties:
        weekStart:
          type: string
          format: date
          example: "2026-11-02"
        weekEnd:
          type: string
          format: date
          example: "2026-11-08"
        venueId:
          type: string
          example: "0011P000012oMxxQAE"
        venueName:
          type: string
          example: "Brittany Hill"
        totalBudgetHours:
          type: number
          example: 52.5
        totalBudgetCost:
          type: number
          example: 1250.00
        goals:
          type: array
          items:
            $ref: '#/components/schemas/LaborGoal'

    LaborGoal:
      type: object
      required:
        - id
        - venueId
        - eventDate
        - role
        - targetHours
      properties:
        id:
          type: string
          example: "lg-101"
        venueId:
          type: string
          example: "0011P000012oMxxQAE"
        venueName:
          type: string
          example: "Brittany Hill"
        eventDate:
          type: string
          format: date
          example: "2026-11-02"
        role:
          type: string
          example: "Banquet Captain"
        targetHeadcount:
          type: integer
          example: 1
        targetHours:
          type: number
          example: 7.0
        hourlyRate:
          type: number
          example: 30.00
        budgetLimit:
          type: number
          example: 210.00

    LaborGoalInput:
      type: object
      required:
        - venueId
        - eventDate
        - role
        - targetHours
      properties:
        venueId:
          type: string
          example: "0011P000012oMxxQAE"
        eventDate:
          type: string
          format: date
          example: "2026-11-02"
        role:
          type: string
          example: "Server"
        targetHeadcount:
          type: integer
          example: 3
        targetHours:
          type: number
          example: 18.0
        hourlyRate:
          type: number
          example: 20.00
        budgetLimit:
          type: number
          example: 360.00

    CSVUploadResult:
      type: object
      required:
        - status
        - insertedRows
        - updatedRows
      properties:
        status:
          type: string
          example: "success"
        insertedRows:
          type: integer
          example: 18
        updatedRows:
          type: integer
          example: 4
        errors:
          type: array
          items:
            type: string
          example: []

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message description.
          example: "Forbidden: user is not assigned to venue 0011P000012oMxxQAE"
