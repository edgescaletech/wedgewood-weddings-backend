openapi: 3.0.3
info:
  title: Wedgewood Weddings API
  version: 1.0.0
  description: AuthKit authentication prototype. Active users currently have access to all venues.
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200': {description: Healthy}
  /api/admin/users:
    get:
      summary: List local users (users.view)
      security: [{SessionCookie: []}]
      description: Searches names and emails. Without view, returns the existing summary array. With view=directory, returns the filtered total and the requested page with role assignments.
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 255}}
        - {name: role, in: query, schema: {type: string}, description: Exact role name. With venueId only the role at that venue or the global Admin role matches.}
        - {name: status, in: query, schema: {type: string, enum: [active, invited, inactive, archived]}}
        - {name: active, in: query, schema: {type: boolean}, description: Filter by the stored active flag.}
        - {name: venueId, in: query, schema: {type: string, maxLength: 64}}
        - {name: canPublish, in: query, schema: {type: boolean}, description: A true value requires venueId and restricts results to active users who can publish at that active venue.}
        - {name: view, in: query, schema: {type: string, enum: [directory]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: User summaries or a directory page.
          content:
            application/json:
              schema:
                oneOf:
                  - {type: array, items: {type: object}}
                  - type: object
                    required: [items, total]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string, format: uuid}
                            email: {type: string}
                            displayName: {type: string}
                            workosId: {type: string, nullable: true}
                            isActive: {type: boolean}
                            archivedAt: {type: string, format: date-time, nullable: true}
                            canPublish: {type: boolean}
                            roles:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: {type: string, format: uuid}
                                  roleId: {type: string, format: uuid}
                                  name: {type: string}
                                  scope: {type: string}
                                  venueId: {type: string, nullable: true}
                      total: {type: integer, minimum: 0}
        '400': {description: Invalid filters or pagination}
        '401': {description: Authentication required}
        '403': {description: Permission denied}
    post:
      summary: Invite a user (users.manage)
      description: Requires matching Origin. Initial roles also require roles.assign and venue grants require venues.manage_access. Assign at most one role per venue. WorkOS sends an application invitation. The local account stays inactive until WorkOS confirms acceptance and an Admin activates it.
      security: [{SessionCookie: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, displayName]
              properties:
                email: {type: string, format: email, maxLength: 254}
                displayName: {type: string, maxLength: 200}
                roles:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [roleId]
                    properties:
                      roleId: {type: string, format: uuid}
                      venueId: {type: string, nullable: true, maxLength: 64}
      responses:
        '204': {description: Invitation delivered and pending local user recorded}
        '400': {description: Invalid request or invitation details rejected by WorkOS}
        '401': {description: Authentication required}
        '403': {description: Origin or grant not authorized}
        '404': {description: Role or venue not found}
        '409': {description: Conflicting operation, existing local account, or replaced invitation venue}
        '415': {description: Expected application/json}
        '503': {description: Invitation could not be finalized. Retry with the same key and request.}
  /api/admin/users/{id}/invitation/resend:
    post:
      summary: Resend or replace an invitation (users.manage)
      description: Resends a pending invitation or replaces an expired one. Requires matching Origin.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Invitation sent}
        '400': {description: Invalid request or invitation rejected by WorkOS}
        '401': {description: Authentication required}
        '403': {description: Origin or permission denied}
        '404': {description: No pending local invitation for this user}
        '409': {description: Invitation can no longer be resent or operation conflicts}
        '503': {description: Invitation could not be finalized. Retry with the same key.}
  /api/admin/users/{id}:
    get:
      summary: Get user and assigned roles (users.view)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: User details}
        '404': {description: User not found}
    patch:
      summary: Update local display name (users.manage)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [displayName], properties: {displayName: {type: string, minLength: 1, description: Must contain a non-whitespace character}}}
      responses:
        '204': {description: Updated}
        '400': {description: Missing or invalid display name}
    delete:
      summary: Archive a user and remove local sessions (users.manage)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Archived}
        '409': {description: Last administrator would be removed}
  /api/admin/audit:
    get:
      summary: List administrative activity (users.manage)
      description: Returns recent audit records for account and target activity. A deleted or unavailable actor is shown as Unavailable actor; historical target and resource identifiers remain available.
      security: [{SessionCookie: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: A page of recent audit events and total count.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: {type: integer, minimum: 0}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, action, actorName, metadata, createdAt]
                      properties:
                        id: {type: string, format: uuid}
                        action: {type: string}
                        actorName: {type: string}
                        actorEmail: {type: string}
                        targetType: {type: string}
                        targetId: {type: string}
                        targetName: {type: string}
                        resourceType: {type: string}
                        resourceExternalId: {type: string}
                        metadata: {type: object, additionalProperties: true}
                        createdAt: {type: string, format: date-time}
        '400': {description: Invalid pagination values}
        '401': {description: Authentication required}
        '403': {description: users.manage permission required}
        '503': {description: Audit history is temporarily unavailable}
  /api/admin/roles:
    get:
      summary: List predefined roles and current permissions (roles.view)
      security: [{SessionCookie: []}]
      responses:
        '200': {description: Role list}
  /api/admin/roles/{id}:
    get:
      summary: Get a predefined role and permissions (roles.view)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Role details}
  /api/admin/roles/{id}/permissions:
    get:
      summary: Get permissions for a role (roles.view)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Role and permissions}
  /api/admin/permissions:
    get:
      summary: List permission definitions (roles.view)
      security: [{SessionCookie: []}]
      responses:
        '200': {description: Permission list}
  /api/admin/venues:
    get:
      summary: List venues (venues.manage_access)
      security: [{SessionCookie: []}]
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 255}, description: Case-insensitive venue name search.}
        - {name: active, in: query, schema: {type: boolean}}
        - {name: view, in: query, schema: {type: string, enum: [directory]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: 'Venue array by default. With view=directory, returns {items, total} for the filtered venues.'}
        '400': {description: Invalid filters or pagination}
  /api/admin/venues/{id}:
    get:
      summary: Get a venue by Salesforce ID (venues.manage_access)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Venue details}
  /api/admin/users/{id}/activate:
    post:
      summary: Activate a linked, unarchived local user (users.manage)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Activated}
        '403': {description: Origin or retained grants exceed the acting admin’s authority}
        '404': {description: Target missing, archived, or awaiting invitation acceptance}
  /api/admin/users/{id}/deactivate:
    post:
      summary: Deactivate a user and remove local sessions (users.manage)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Deactivated}
        '409': {description: Last administrator protection}
  /api/admin/users/{id}/roles:
    get:
      summary: List assigned roles (users.view)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Assignments}
    post:
      summary: Assign a predefined role (roles.assign and venues.manage_access for venue roles)
      description: Supply an active Salesforce venue ID for venue roles. Omit venueId or use null for global roles.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [roleId], properties: {roleId: {type: string, format: uuid}, venueId: {type: string, nullable: true}}}
      responses:
        '204': {description: Assigned}
        '400': {description: Invalid assignment or inactive venue}
        '404': {description: Role or venue not found}
        '409': {description: User already has a role at this venue}
  /api/admin/users/{id}/roles/{assignmentId}:
    put:
      summary: Replace the role at an existing venue assignment
      description: Requires roles.assign, venues.manage_access, and authority to grant the replacement role. The old assignment is replaced atomically at the same venue and the change is audited. Read the user again to obtain the new assignment ID.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [roleId], properties: {roleId: {type: string, format: uuid}}}
      responses:
        '204': {description: Venue role updated}
        '400': {description: Invalid role or inactive venue}
        '401': {description: Authentication required}
        '403': {description: Permission denied}
        '404': {description: Venue assignment or role missing}
    delete:
      summary: Remove a role assignment (roles.assign and venues.manage_access for venue roles)
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Removed}
        '409': {description: Last administrator protection}
  /api/admin/users/{id}/permissions:
    get:
      summary: Show role-derived permissions (users.view)
      description: Inactive venues deny scoped permissions. Global management permissions are evaluated independently.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: venueId, in: query, schema: {type: string}}
      responses:
        '200': {description: 'Array of permission, inherited, and effective fields. Inherited and effective are equal under role-only RBAC.'}
        '404': {description: User or venue not found}
  /api/admin/venues/{id}/users:
    get:
      summary: List direct venue role assignments (venues.manage_access)
      description: Includes grants at suspended venues so administrators can inspect and revoke them.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Venue users}
  /auth/password:
    post:
      summary: Sign in with email and password
      description: Requires an Origin matching APP_URL. WorkOS verifies credentials; email verification may be required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '204': {description: Session cookie created}
        '202': {description: Email verification required; an encrypted challenge cookie is set}
        '400': {description: Invalid request}
        '401': {description: Sign-in failed or requires additional verification}
        '403': {description: Invalid origin or no eligible local account}
        '409': {description: Another local account owns this email}
        '429': {description: Too many attempts}
        '503': {description: Authentication unavailable}
  /auth/verify-email:
    post:
      summary: Complete email verification after password sign-in
      description: Requires a matching Origin and the encrypted verification cookie returned by password sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '204': {description: Email verified and session cookie created}
        '401': {description: Invalid or expired challenge}
        '409': {description: Another local account owns this email}
        '403': {description: Invalid origin}
        '503': {description: Verification temporarily unavailable}
  /auth/forgot-password:
    post:
      summary: Request a password reset email
      description: Returns the same response whether the email exists; requires a matching Origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '204': {description: Reset request accepted}
        '400': {description: Invalid request}
        '403': {description: Invalid origin}
        '503': {description: Reset temporarily unavailable}
  /auth/reset-password:
    post:
      summary: Set a new password using the token from the reset link
      description: Requires a matching Origin. Successful reset invalidates local sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: {type: string}
                newPassword: {type: string, format: password}
      responses:
        '204': {description: Password reset completed}
        '400': {description: Invalid token or password}
        '403': {description: Invalid origin}
        '503': {description: WorkOS unavailable or local session cleanup failed}
  /auth/login:
    get:
      summary: Begin hosted AuthKit sign-in
      responses:
        '302': {description: Redirect to WorkOS}
  /auth/callback:
    get:
      summary: Complete AuthKit sign-in
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '303': {description: Session created; redirect to application}
        '400': {description: Invalid state}
        '409': {description: Another local account owns this email}
        '401': {description: Authentication failed}
  /auth/me:
    get:
      summary: Get the current active local user
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {description: Unauthenticated}
        '403': {description: Inactive account}
  /auth/access:
    get:
      summary: Get the current user's global and venue access
      description: Roles are listed where directly assigned. Each visible venue includes the union of its direct permissions and global permissions. Venues are keyed by Salesforce venue ID. The predefined global Admin role can see every active venue. Other users see active venues with direct assignments.
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Current database-backed access
          content:
            application/json:
              schema:
                type: object
                required: [global, venues]
                properties:
                  global: {$ref: '#/components/schemas/AccessGrants'}
                  venues:
                    type: object
                    additionalProperties: {$ref: '#/components/schemas/AccessGrants'}
        '401': {description: Authentication required}
        '403': {description: Inactive account}
        '503': {description: Authentication or authorization unavailable}
  /api/me/venues:
    get:
      summary: List active venues visible to the current user
      description: The predefined global Admin role can see every active venue. Other users see active venues with direct assignments. Results are ordered by venue name, then ID. Roles are those assigned directly at each venue.
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Visible venues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, roles]
                  properties:
                    id: {type: string, description: Salesforce venue ID}
                    name: {type: string}
                    roles:
                      type: array
                      items: {type: string}
        '401': {description: Authentication required}
        '403': {description: Inactive account}
        '503': {description: Authentication or venue information unavailable}
  /auth/logout:
    post:
      summary: End the current session
      description: Requires an Origin header matching APP_URL.
      security: [{SessionCookie: []}]
      responses:
        '204': {description: Session ended}
        '403': {description: Invalid origin}
        '503': {description: Local or remote logout failed}
  /api/events:
    get:
      summary: List weekly Salesforce events
      security: [{SessionCookie: []}]
      parameters:
        - {name: week, in: query, schema: {type: string, format: date}}
        - {name: venueId, in: query, schema: {type: string}}
        - {name: refresh, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Weekly events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeeklyEventsResponse'}
        '400': {description: Invalid week}
        '401': {description: Unauthenticated}
  /api/sync/events:
    post:
      summary: Trigger asynchronous background sync of Salesforce events
      description: Non-blocking endpoint. Returns 202 Accepted immediately while worker syncs in background.
      security: [{SessionCookie: []}]
      parameters:
        - {name: week, in: query, schema: {type: string, format: date}, description: 'Week start date (YYYY-MM-DD)'}
      responses:
        '202':
          description: Sync job initiated in background
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: "accepted"}
                  message: {type: string, example: "sync started in background"}
                  weekStart: {type: string, format: date}
                  weekEnd: {type: string, format: date}
        '400': {description: Invalid week}
        '401': {description: Unauthenticated}
        '403': {description: Inactive account}
  /api/events/{id}:
    get:
      summary: Get a wedding event by Salesforce ID
      description: Loads from PostgreSQL with a fallback to Salesforce.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Enriched wedding event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeddingEvent'}
        '400': {description: Missing event ID}
        '401': {description: Unauthenticated}
        '403': {description: Inactive account}
        '404': {description: Event not found}
components:
  securitySchemes:
    SessionCookie: {type: apiKey, in: cookie, name: session}
  schemas:
    AccessGrants:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {type: string}
    User:
      type: object
      required: [id, workosId, email, isActive]
      properties:
        id: {type: string, format: uuid}
        workosId: {type: string}
        email: {type: string, format: email}
        isActive: {type: boolean}
    WeeklyEventsResponse:
      type: object
      required:
        - weekStart
        - weekEnd
        - source
        - events
      properties:
        weekStart:
          type: string
          format: date
          description: Monday start date of the requested week (YYYY-MM-DD).
          example: "2026-11-02"
        weekEnd:
          type: string
          format: date
          description: Sunday end date of the requested week (YYYY-MM-DD).
          example: "2026-11-08"
        source:
          type: string
          enum: [database, salesforce]
          description: Source of the returned events.
          example: database
        events:
          type: array
          description: List of wedding events scheduled for the week.
          items:
            $ref: '#/components/schemas/WeddingEvent'

    WeddingEvent:
      type: object
      required:
        - id
        - name
        - eventDate
        - stageName
      properties:
        id:
          type: string
          description: Salesforce Opportunity 18-character ID (starts with 006).
          example: "006Pq00000aeF0RIAU"
        name:
          type: string
          description: Wedding event name / couple title.
          example: "Enoch Mendez & Arieanna Lager Ceremony & Reception"
        eventDate:
          type: string
          format: date
          description: Wedding date (YYYY-MM-DD).
          example: "2026-11-02"
        dayOfWeek:
          type: string
          description: Day of the week.
          example: "Monday"
        startTime:
          type: string
          description: Formatted ceremony/event start time.
          example: "11:00 PM"
        endTime:
          type: string
          description: Formatted reception end time.
          example: "4:00 AM"
        eventType:
          type: string
          description: Wedding event classification detail.
          example: "Ceremony & Reception"
        guestCount:
          type: integer
          description: Expected guest count (covers).
          example: 41
        venue:
          type: string
          description: Venue name display formula.
          example: "Brittany Hill"
        venueId:
          type: string
          description: Salesforce Account ID of the venue (starts with 001).
          example: "0011P000012oMxxQAE"
        venueProperty:
          type: string
          description: Traversed Account Name of the venue.
          example: "Brittany Hill"
        venueGM:
          type: string
          description: Venue General Manager name (traversed from User lookup).
          example: "Danielle Martinez"
        ceremonyLocation:
          type: string
          description: Specific ceremony area within venue property.
          example: "Lakeside Arbor"
        photoBooth:
          type: boolean
          description: Indicates whether a photo booth is booked for the event.
          example: true
        photoboothStaffed:
          type: boolean
          description: Indicates if photo booth is staffed by venue staff vs external vendor.
          example: false
        hasBar:
          type: boolean
          description: True if bar or cocktail hour is configured.
          example: true
        barLocation:
          type: string
          description: Area where bar/cocktail hour takes place.
          example: "Terrace Cocktail Patio"
        signatureDrinks:
          type: string
          description: Specialty cocktail details from Primary Planning Details.
          example: "Mojito & Spicy Paloma"
        chargerPlates:
          type: string
          description: Table charger plate style from Primary Planning Details.
          example: "Gold Beaded Charger"
        notes:
          type: string
          description: Coordinator notes and special date notes.
          example: "Allergy alert: Groom has peanut allergy"
        stageName:
          type: string
          description: Salesforce Opportunity Stage.
          example: "Closed Won"
        package:
          type: string
          description: Package tier formula.
          example: "Classic Package"
        coordinator:
          type: string
          description: Assigned Wedgewood Day-of Coordinator name.
          example: "Jessica Reynolds"
        djName:
          type: string
          description: Assigned DJ Name.
          example: "DJ Beats & Harmony"
        decorSetupTime:
          type: string
          description: Earliest allowed vendor/decor setup time.
          example: "9:00 AM"
        beoNotes:
          type: string
          description: Staff-Facing BEO Rich Text notes.
          example: "<p>Final walkthrough completed with couple on 10/19.</p>"
        contractSigned:
          type: boolean
          description: Indicates whether client contract has been executed.
          example: true
        quote:
          $ref: '#/components/schemas/QuoteDetails'

    QuoteDetails:
      type: object
      description: Enriched CPQ Quote & Quote Line catering, bar, and rental breakdown.
      properties:
        quoteId:
          type: string
          description: Salesforce CPQ Quote ID (starts with a2M).
          example: "a2MPq0000000sXYZIAU"
        quoteNumber:
          type: string
          description: Quote reference number.
          example: "Q-40105775"
        isPrimary:
          type: boolean
          description: Indicates if this quote is flagged as Primary on the Opportunity.
          example: true
        mealService:
          type: string
          description: Meal service format.
          example: "Buffet Service"
        mealPackage:
          type: string
          description: Banquet food meal package name.
          example: "Three Entree Buffet"
        mealPackageQty:
          type: number
          description: Meal package guest cover count.
          example: 41
        barPackage:
          type: string
          description: Bar package specification.
          example: "Premium Hosted Bar"
        hostedBarType:
          type: string
          description: Specific hosted bar line item name.
          example: "Hosted Premium Bar Service"
        hostedBarHours:
          type: number
          description: Number of hosted bar service hours.
          example: 4
        noHostBar:
          type: string
          description: Populated if a No-Host / Cash Bar line exists.
          example: ""
        champagne:
          type: string
          description: Champagne toast item.
          example: "Champagne Toast for All Guests"
        champagneQty:
          type: number
          description: Champagne cover quantity.
          example: 41
        wine:
          type: string
          description: Wine product line.
          example: "Hosted Wine with Dinner"
        wineQty:
          type: number
          description: Wine guest cover quantity.
          example: 41
        wineGlassesNeeded:
          type: boolean
          description: Inferred table setting requirement for wine glasses.
          example: true
        champagneFlutesNeeded:
          type: boolean
          description: Inferred table setting requirement for champagne flutes.
          example: true
        lateNightSnacks:
          type: array
          description: Late night snacks / munchies selected.
          items:
            type: string
          example: ["Mini Grilled Cheese & Tomato Soup", "Warm Pretzel Bites"]
        loveLetters:
          type: string
          description: Marquee Love Letters decor package.
          example: "Illuminated LOVE Letters 4ft"
        loveLettersQty:
          type: number
          description: Love Letters quantity.
          example: 1
        barItems:
          type: array
          description: Comprehensive beverage and bar service selections.
          items:
            type: string
          example: ["Champagne Toast for All Guests", "Wine: Cabernet Sauvignon"]
        appetizers:
          type: array
          description: Cocktail hour hors d'oeuvres and appetizers.
          items:
            type: string
          example: ["Mini Crab Cakes with Remoulade", "Chicken & Waffles Bites", "Cheese with Wafers"]
        entrees:
          type: array
          description: Selected dinner entrees.
          items:
            type: string
          example: ["Panko Parmesan Chicken", "Carved Pit Ham with Dijon Glaze"]
        sidesSalads:
          type: array
          description: Accompaniment side dishes and salads.
          items:
            type: string
          example: ["Garlic Mashed Potatoes", "Seasonal Roasted Vegetables", "Garden Salad"]
        dessert:
          type: string
          description: Wedding dessert or cake item.
          example: "Personalized Wedding Cake"
        linens:
          type: array
          description: Selected table linen items and colors.
          items:
            type: string
          example: ["Linen, Elite Full Length", "Linen Color: Ivory"]
        napkins:
          type: string
          description: Napkin selection and color.
          example: "Napkin Color: Burgundy"
        chairs:
          type: string
          description: Seating selection.
          example: "Chairs, Elite Chiavari"
        decorRentals:
          type: array
          description: Event decor and rental items.
          items:
            type: string
          example: ["Floral Centerpieces", "Gold Charger Plates", "Lawn Games Bundle"]
