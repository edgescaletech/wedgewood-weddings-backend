openapi: 3.0.3
info:
  title: Wedgewood Weddings API
  version: 1.0.0
  description: AuthKit authentication prototype. Active users currently have access to all venues.
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200': {description: Healthy}
  /auth/password:
    post:
      summary: Sign in with email and password
      description: Requires an Origin matching APP_URL. WorkOS verifies credentials; additional verification challenges are not yet supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '204': {description: Session cookie created}
        '400': {description: Invalid request}
        '401': {description: Sign-in failed or requires additional verification}
        '403': {description: Invalid origin}
        '429': {description: Too many attempts}
        '503': {description: Authentication unavailable}
  /auth/login:
    get:
      summary: Begin hosted AuthKit sign-in
      responses:
        '302': {description: Redirect to WorkOS}
  /auth/callback:
    get:
      summary: Complete AuthKit sign-in
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '303': {description: Session created; redirect to application}
        '400': {description: Invalid state}
        '401': {description: Authentication failed}
  /auth/me:
    get:
      summary: Get the current active local user
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {description: Unauthenticated}
        '403': {description: Inactive account}
  /api/auth/me:
    get:
      summary: Alias for /auth/me
      security: [{SessionCookie: []}]
      responses:
        '200': {description: Current user}
        '401': {description: Unauthenticated}
        '403': {description: Inactive account}
  /auth/logout:
    post:
      summary: End the current session
      description: Requires an Origin header matching APP_URL.
      security: [{SessionCookie: []}]
      responses:
        '204': {description: Session ended}
        '403': {description: Invalid origin}
        '503': {description: Local or remote logout failed}
  /api/events:
    get:
      summary: List weekly Salesforce events
      security: [{SessionCookie: []}]
      parameters:
        - {name: week, in: query, schema: {type: string, format: date}}
        - {name: venueId, in: query, schema: {type: string}}
        - {name: refresh, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Weekly events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeeklyEventsResponse'}
        '400': {description: Invalid week}
        '401': {description: Unauthenticated}
        '403': {description: Inactive account}
  /api/events/{id}:
    get:
      summary: Get a wedding event by Salesforce ID
      description: Loads from PostgreSQL with a fallback to Salesforce.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Enriched wedding event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WeddingEvent'}
        '400': {description: Missing event ID}
        '401': {description: Unauthenticated}
        '403': {description: Inactive account}
        '404': {description: Event not found}
components:
  securitySchemes:
    SessionCookie: {type: apiKey, in: cookie, name: session}
  schemas:
    User:
      type: object
      required: [id, workosId, email, isActive]
      properties:
        id: {type: string, format: uuid}
        workosId: {type: string}
        email: {type: string, format: email}
        isActive: {type: boolean}
    WeeklyEventsResponse:
      type: object
      required:
        - weekStart
        - weekEnd
        - source
        - events
      properties:
        weekStart:
          type: string
          format: date
          description: Monday start date of the requested week (YYYY-MM-DD).
          example: "2026-11-02"
        weekEnd:
          type: string
          format: date
          description: Sunday end date of the requested week (YYYY-MM-DD).
          example: "2026-11-08"
        source:
          type: string
          enum: [database, salesforce]
          description: Source of the returned events.
          example: database
        events:
          type: array
          description: List of wedding events scheduled for the week.
          items:
            $ref: '#/components/schemas/WeddingEvent'

    WeddingEvent:
      type: object
      required:
        - id
        - name
        - eventDate
        - stageName
      properties:
        id:
          type: string
          description: Salesforce Opportunity 18-character ID (starts with 006).
          example: "006Pq00000aeF0RIAU"
        name:
          type: string
          description: Wedding event name / couple title.
          example: "Enoch Mendez & Arieanna Lager Ceremony & Reception"
        eventDate:
          type: string
          format: date
          description: Wedding date (YYYY-MM-DD).
          example: "2026-11-02"
        dayOfWeek:
          type: string
          description: Day of the week.
          example: "Monday"
        startTime:
          type: string
          description: Formatted ceremony/event start time.
          example: "11:00 PM"
        endTime:
          type: string
          description: Formatted reception end time.
          example: "4:00 AM"
        eventType:
          type: string
          description: Wedding event classification detail.
          example: "Ceremony & Reception"
        guestCount:
          type: integer
          description: Expected guest count (covers).
          example: 41
        venue:
          type: string
          description: Venue name display formula.
          example: "Brittany Hill"
        venueId:
          type: string
          description: Salesforce Account ID of the venue (starts with 001).
          example: "0011P000012oMxxQAE"
        venueProperty:
          type: string
          description: Traversed Account Name of the venue.
          example: "Brittany Hill"
        venueGM:
          type: string
          description: Venue General Manager name (traversed from User lookup).
          example: "Danielle Martinez"
        ceremonyLocation:
          type: string
          description: Specific ceremony area within venue property.
          example: "Lakeside Arbor"
        photoBooth:
          type: boolean
          description: Indicates whether a photo booth is booked for the event.
          example: true
        photoboothStaffed:
          type: boolean
          description: Indicates if photo booth is staffed by venue staff vs external vendor.
          example: false
        hasBar:
          type: boolean
          description: True if bar or cocktail hour is configured.
          example: true
        barLocation:
          type: string
          description: Area where bar/cocktail hour takes place.
          example: "Terrace Cocktail Patio"
        signatureDrinks:
          type: string
          description: Specialty cocktail details from Primary Planning Details.
          example: "Mojito & Spicy Paloma"
        chargerPlates:
          type: string
          description: Table charger plate style from Primary Planning Details.
          example: "Gold Beaded Charger"
        notes:
          type: string
          description: Coordinator notes and special date notes.
          example: "Allergy alert: Groom has peanut allergy"
        stageName:
          type: string
          description: Salesforce Opportunity Stage.
          example: "Closed Won"
        package:
          type: string
          description: Package tier formula.
          example: "Classic Package"
        coordinator:
          type: string
          description: Assigned Wedgewood Day-of Coordinator name.
          example: "Jessica Reynolds"
        djName:
          type: string
          description: Assigned DJ Name.
          example: "DJ Beats & Harmony"
        decorSetupTime:
          type: string
          description: Earliest allowed vendor/decor setup time.
          example: "9:00 AM"
        beoNotes:
          type: string
          description: Staff-Facing BEO Rich Text notes.
          example: "<p>Final walkthrough completed with couple on 10/19.</p>"
        contractSigned:
          type: boolean
          description: Indicates whether client contract has been executed.
          example: true
        quote:
          $ref: '#/components/schemas/QuoteDetails'

    QuoteDetails:
      type: object
      description: Enriched CPQ Quote & Quote Line catering, bar, and rental breakdown.
      properties:
        quoteId:
          type: string
          description: Salesforce CPQ Quote ID (starts with a2M).
          example: "a2MPq0000000sXYZIAU"
        quoteNumber:
          type: string
          description: Quote reference number.
          example: "Q-40105775"
        isPrimary:
          type: boolean
          description: Indicates if this quote is flagged as Primary on the Opportunity.
          example: true
        mealService:
          type: string
          description: Meal service format.
          example: "Buffet Service"
        mealPackage:
          type: string
          description: Banquet food meal package name.
          example: "Three Entree Buffet"
        mealPackageQty:
          type: number
          description: Meal package guest cover count.
          example: 41
        barPackage:
          type: string
          description: Bar package specification.
          example: "Premium Hosted Bar"
        hostedBarType:
          type: string
          description: Specific hosted bar line item name.
          example: "Hosted Premium Bar Service"
        hostedBarHours:
          type: number
          description: Number of hosted bar service hours.
          example: 4
        noHostBar:
          type: string
          description: Populated if a No-Host / Cash Bar line exists.
          example: ""
        champagne:
          type: string
          description: Champagne toast item.
          example: "Champagne Toast for All Guests"
        champagneQty:
          type: number
          description: Champagne cover quantity.
          example: 41
        wine:
          type: string
          description: Wine product line.
          example: "Hosted Wine with Dinner"
        wineQty:
          type: number
          description: Wine guest cover quantity.
          example: 41
        wineGlassesNeeded:
          type: boolean
          description: Inferred table setting requirement for wine glasses.
          example: true
        champagneFlutesNeeded:
          type: boolean
          description: Inferred table setting requirement for champagne flutes.
          example: true
        lateNightSnacks:
          type: array
          description: Late night snacks / munchies selected.
          items:
            type: string
          example: ["Mini Grilled Cheese & Tomato Soup", "Warm Pretzel Bites"]
        loveLetters:
          type: string
          description: Marquee Love Letters decor package.
          example: "Illuminated LOVE Letters 4ft"
        loveLettersQty:
          type: number
          description: Love Letters quantity.
          example: 1
        barItems:
          type: array
          description: Comprehensive beverage and bar service selections.
          items:
            type: string
          example: ["Champagne Toast for All Guests", "Wine: Cabernet Sauvignon"]
        appetizers:
          type: array
          description: Cocktail hour hors d'oeuvres and appetizers.
          items:
            type: string
          example: ["Mini Crab Cakes with Remoulade", "Chicken & Waffles Bites", "Cheese with Wafers"]
        entrees:
          type: array
          description: Selected dinner entrees.
          items:
            type: string
          example: ["Panko Parmesan Chicken", "Carved Pit Ham with Dijon Glaze"]
        sidesSalads:
          type: array
          description: Accompaniment side dishes and salads.
          items:
            type: string
          example: ["Garlic Mashed Potatoes", "Seasonal Roasted Vegetables", "Garden Salad"]
        dessert:
          type: string
          description: Wedding dessert or cake item.
          example: "Personalized Wedding Cake"
        linens:
          type: array
          description: Selected table linen items and colors.
          items:
            type: string
          example: ["Linen, Elite Full Length", "Linen Color: Ivory"]
        napkins:
          type: string
          description: Napkin selection and color.
          example: "Napkin Color: Burgundy"
        chairs:
          type: string
          description: Seating selection.
          example: "Chairs, Elite Chiavari"
        decorRentals:
          type: array
          description: Event decor and rental items.
          items:
            type: string
          example: ["Floral Centerpieces", "Gold Charger Plates", "Lawn Games Bundle"]
